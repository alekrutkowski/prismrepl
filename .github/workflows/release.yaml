name: Build six native release binaries

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: windows-2022, arch: x86_64}
          - {os: windows-11-arm, arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: macos-15, arch: arm64}
    env:
      R_KEEP_PKG_SOURCE: yes
      R_COMPILE_AND_INSTALL_PACKAGES: always
      EXPECTED_ARCH: ${{ matrix.arch }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          Ncpus: '2'
      - name: Verify native R architecture
        run: Rscript tools/verify-platform.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
      - name: Compile and package this platform
        run: Rscript tools/build-release.R
      - name: Verify the Windows console before release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PRISM_TEST_CLIPBOARD: '1'
        run: |
          R CMD INSTALL .
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
          ./tools/windows-console-smoke.ps1
      - name: Verify the full-screen terminal before release
        if: runner.os != 'Windows'
        run: |
          R CMD INSTALL .
          python3 tools/pty-fullscreen.py
          python3 tools/pty-explorer.py
          python3 tools/pty-commands.py
          python3 tools/pty-options.py
          python3 tools/pty-docs.py
          python3 tools/pty-files.py
          python3 tools/native/pty-exit.py
          python3 tools/native/pty-io.py
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Verify and hash the complete release
        run: |
          python3 tools/test-release-manifest.py
          python3 tools/release-manifest.py release-assets
      - name: Create a draft GitHub Release with all binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag --draft --title "prismrepl $RELEASE_TAG"
          --notes-file RELEASE.md

